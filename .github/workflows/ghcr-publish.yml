# Build 216labs/* images and push to GHCR so the droplet activator can
# `docker pull` + retag on cold start when the image is missing locally.
name: Publish images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "deploy.sh"
      - ".github/workflows/ghcr-publish.yml"
      - "scripts/compose-ghcr-matrix.py"
      - "scripts/ghcr-build-push.sh"
      - "config/**"
      - "products/**"
      - "internal/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY_PREFIX: ghcr.io/6cubed/216labs
  # Comma-separated compose service names to skip (see scripts/compose-ghcr-matrix.py). Empty = build all.
  GHCR_SKIP_SERVICES: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Collect changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            : > changed_files.txt
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > changed_files.txt
            else
              git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
            fi
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat changed_files.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Validate manifest build specs
        run: ./scripts/validate-manifest-build-spec.sh
      - name: Ensure compose env files
        run: |
          test -f .env || cp .env.example .env
          touch .env.admin
      - name: Docker compose config (JSON)
        run: docker compose --env-file .env --env-file .env.admin config --format json > compose.json
      - id: set-matrix
        run: |
          set -euo pipefail
          export GHCR_CHANGED_FILES="$(cat changed_files.txt)"
          python3 scripts/compose-ghcr-matrix.py compose.json > matrix.json
          echo "matrix<<EOF_216LABS_GHCR_MATRIX" >> "$GITHUB_OUTPUT"
          cat matrix.json >> "$GITHUB_OUTPUT"
          echo "EOF_216LABS_GHCR_MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(python3 -c "import json; print(len(json.load(open('matrix.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Matrix size
        run: |
          python3 -c "
          import json
          m = json.load(open('matrix.json'))
          c = sum(1 for r in m if r.get('required') == 'true')
          print('services:', len(m), 'critical:', c, 'optional:', len(m) - c)
          "

  build-push:
    needs: setup
    if: needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure compose env files
        run: |
          test -f .env || cp .env.example .env
          touch .env.admin
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        continue-on-error: ${{ matrix.required != 'true' }}
        env:
          SERVICE: ${{ matrix.service }}
          SRC_IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY_PREFIX: ${{ env.REGISTRY_PREFIX }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: chmod +x scripts/ghcr-build-push.sh && ./scripts/ghcr-build-push.sh

  gate:
    needs: [setup, build-push]
    if: always() && needs.setup.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Spine images must publish
        run: |
          if [ "${{ needs.build-push.result }}" = "failure" ]; then
            echo "At least one required (config/ghcr-always-include.txt) GHCR build failed." >&2
            exit 1
          fi
          echo "GHCR publish OK (optional matrix failures are allowed)."
