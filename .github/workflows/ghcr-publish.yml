# Build 216labs/* images and push to GHCR so the droplet activator can
# `docker pull` + retag on cold start when the image is missing locally.
name: Publish images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "deploy.sh"
      - ".github/workflows/ghcr-publish.yml"
      - "scripts/compose-ghcr-matrix.py"
      - "config/**"
      - "products/**"
      - "internal/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY_PREFIX: ghcr.io/6cubed/216labs
  # Comma-separated compose service names to skip (see scripts/compose-ghcr-matrix.py). Empty = build all.
  GHCR_SKIP_SERVICES: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix_critical: ${{ steps.set-matrix.outputs.matrix_critical }}
      matrix_optional: ${{ steps.set-matrix.outputs.matrix_optional }}
      count_critical: ${{ steps.set-matrix.outputs.count_critical }}
      count_optional: ${{ steps.set-matrix.outputs.count_optional }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Collect changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            : > changed_files.txt
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              git ls-files > changed_files.txt
            else
              git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
            fi
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat changed_files.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Ensure compose env files
        run: |
          test -f .env || cp .env.example .env
          touch .env.admin
      - name: Docker compose config (JSON)
        run: docker compose --env-file .env --env-file .env.admin config --format json > compose.json
      - id: set-matrix
        run: |
          # Do not pass multiline changed paths via job outputs (truncation risk). The changed step
          # already wrote changed_files.txt on disk for this runner.
          set -euo pipefail
          export GHCR_CHANGED_FILES="$(cat changed_files.txt)"
          python3 scripts/compose-ghcr-matrix.py compose.json --split > matrix.json
          test -s matrix-critical.json
          test -s matrix-optional.json
          # Each multiline output needs a unique delimiter (reusing one drops earlier outputs).
          echo "matrix_critical<<MATRIX_CRITICAL_JSON" >> "$GITHUB_OUTPUT"
          cat matrix-critical.json >> "$GITHUB_OUTPUT"
          echo "MATRIX_CRITICAL_JSON" >> "$GITHUB_OUTPUT"
          echo "matrix_optional<<MATRIX_OPTIONAL_JSON" >> "$GITHUB_OUTPUT"
          cat matrix-optional.json >> "$GITHUB_OUTPUT"
          echo "MATRIX_OPTIONAL_JSON" >> "$GITHUB_OUTPUT"
          CRIT=$(python3 -c "import json; print(len(json.load(open('matrix-critical.json'))))")
          OPT=$(python3 -c "import json; print(len(json.load(open('matrix-optional.json'))))")
          echo "count_critical=$CRIT" >> "$GITHUB_OUTPUT"
          echo "count_optional=$OPT" >> "$GITHUB_OUTPUT"
      - name: Matrix size
        run: |
          python3 -c "import json; m=json.load(open('matrix.json')); c=json.load(open('matrix-critical.json')); o=json.load(open('matrix-optional.json')); print('services:', len(m), 'critical:', len(c), 'optional:', len(o))"

  build-push-critical:
    needs: setup
    if: needs.setup.outputs.count_critical != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix_critical) }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure compose env files
        run: |
          test -f .env || cp .env.example .env
          touch .env.admin
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 20
          uses: docker/login-action@v3
          with: |
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
          SRC_IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY_PREFIX: ${{ env.REGISTRY_PREFIX }}
        run: chmod +x scripts/ghcr-build-push.sh && ./scripts/ghcr-build-push.sh

  # Non-spine images: flakes here must not fail the workflow (activator uses critical :latest).
  build-push-optional:
    needs: setup
    if: needs.setup.outputs.count_optional != '0'
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix_optional) }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure compose env files
        run: |
          test -f .env || cp .env.example .env
          touch .env.admin
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 20
          uses: docker/login-action@v3
          with: |
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
          SRC_IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          GITHUB_SHA: ${{ github.sha }}
          REGISTRY_PREFIX: ${{ env.REGISTRY_PREFIX }}
        run: chmod +x scripts/ghcr-build-push.sh && ./scripts/ghcr-build-push.sh
